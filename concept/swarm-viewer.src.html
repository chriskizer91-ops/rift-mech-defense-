<style>

<!--THREE-->
<script>
'use strict';
const T=THREE;
// ---------------------------------------------------------------- renderer and targets
const cv=document.createElement('canvas');document.body.prepend(cv);
const R=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance',alpha:false});
const PR=Math.min(window.devicePixelRatio||1,2);
const gl=R.getContext();
const HALF=!!(R.extensions.has('EXT_color_buffer_float')||R.extensions.has('EXT_color_buffer_half_float'));
const FT=HALF?T.HalfFloatType:T.UnsignedByteType;
let W=1,H=1;
function mkRT(w,h){return new T.WebGLRenderTarget(w,h,{type:FT,format:T.RGBAFormat,depthBuffer:false,minFilter:T.LinearFilter,magFilter:T.LinearFilter});}
let rtS,rtH1,rtH2,rtQ1,rtQ2;
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(45,1,0.05,6000);
const fsCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
const fsScene=new T.Scene();
const fsQuad=new T.Mesh(new T.PlaneGeometry(2,2));fsQuad.frustumCulled=false;fsScene.add(fsQuad);
function resize(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  R.setPixelRatio(PR);R.setSize(W,H,false);
  const w=Math.floor(W*PR),h=Math.floor(H*PR);
  [rtS,rtH1,rtH2,rtQ1,rtQ2].forEach(t=>t&&t.dispose());
  rtS=mkRT(w,h);rtH1=mkRT(w>>1,h>>1);rtH2=mkRT(w>>1,h>>1);rtQ1=mkRT(w>>2,h>>2);rtQ2=mkRT(w>>2,h>>2);
  cam.aspect=W/H;cam.updateProjectionMatrix();
}
// px per metre at distance 1 (for world-sized dots)
function pxScale(){return (H*PR)/(2*Math.tan(cam.fov*Math.PI/360));}

// ---------------------------------------------------------------- shared shader bits
const ADD={transparent:true,depthTest:false,depthWrite:false,blending:T.CustomBlending,blendEquation:T.AddEquation,blendSrc:T.OneFactor,blendDst:T.OneFactor};
const DOT_FRAG=`varying vec3 vC;varying float vA;uniform float uSoft;
void main(){vec2 d=gl_PointCoord-.5;float r=length(d)*2.;if(r>1.)discard;
 float core=exp(-r*r*mix(5.5,1.6,uSoft));gl_FragColor=vec4(vC*vA*core,1.);}`;
const HASH=`float hs(float n){return fract(sin(n)*43758.5453);}`;

// CPU-driven dots (motes 10..500, allies, trails). aCol = channel mix (r hostile, g grid, b ally)
const dotMat=new T.ShaderMaterial(Object.assign({uniforms:{uSize:{value:.3},uScale:{value:1},uMin:{value:2},uMax:{value:48},uSoft:{value:0},uGain:{value:1},uT:{value:0},uBoil:{value:0},uBF:{value:1}},
 vertexShader:`attribute vec3 aCol;attribute float aI;uniform float uSize,uScale,uMin,uMax,uGain,uT,uBoil,uBF;varying vec3 vC;varying float vA;
 void main(){vec3 p0=position;if(uBoil>0.){vec3 w=p0*uBF;p0+=vec3(sin(w.y*1.7+uT*1.1)+sin(w.z*2.3-uT*.8),sin(w.z*1.9+uT*.9)+sin(w.x*2.1+uT*1.3),sin(w.x*1.5-uT*1.2)+sin(w.y*2.5+uT*.7))*uBoil*aCol.r*(1.-aCol.b);}
  vec4 mv=modelViewMatrix*vec4(p0,1.);gl_Position=projectionMatrix*mv;
  float px=uSize*uScale/max(.001,-mv.z);float cl=clamp(px,uMin,uMax);
  vA=aI*uGain*min(1.,px*px/(cl*cl)+.4);gl_PointSize=cl;vC=aCol;}`,
 fragmentShader:DOT_FRAG},ADD));

// THE HOST: one million dots, all motion on the GPU
const NPART=12;
const hostMat=new T.ShaderMaterial(Object.assign({uniforms:{uPart:{value:Array.from({length:NPART},()=>new T.Matrix4())},uPartL:{value:Array.from({length:NPART},()=>new T.Matrix4())},
  uT:{value:0},uRes:{value:1},uQ:{value:0},uPulse:{value:0},uCoreC:{value:new T.Vector3()},uMaw:{value:0},uReach:{value:0},uAg:{value:0},uTB:{value:Array.from({length:12},()=>new T.Vector4())},uTD:{value:Array.from({length:12},()=>new T.Vector4())},
  uSize:{value:.45},uScale:{value:1},uMin:{value:1.2},uMax:{value:6},uSoft:{value:0},uGain:{value:.03},uCG:{value:6},uCloud:{value:new T.Vector3(0,0,0)}},
 vertexShader:`attribute vec4 aSeed;attribute float aPart;uniform mat4 uPart[${NPART}];uniform mat4 uPartL[${NPART}];uniform vec4 uTB[12];uniform vec4 uTD[12];
 uniform float uT,uRes,uQ,uPulse,uSize,uScale,uMin,uMax,uGain,uCG,uMaw,uReach,uAg;uniform vec3 uCoreC,uCloud;varying vec3 vC;varying float vA;${HASH}
 void main(){int pi=int(aPart+.5);vec3 tp;float hot=0.;float lag=aSeed.z*aSeed.z*.85;
  if(pi==8){float Hh=60.;float y=mod(position.y*Hh+uT*(5.+aSeed.y*9.),Hh);float f=y/Hh;   // the rift column it pours up out of
    float rad=mix(64.,17.,pow(f,.5))*(.15+.85*position.z);float ang=position.x+uT*(.3+.45*aSeed.x)+f*6.;
    tp=vec3(cos(ang)*rad,y,sin(ang)*rad*.8-6.);hot=.3*(1.-f);}
  else if(pi==9){vec4 q=vec4(uCoreC+position*(1.+.16*uPulse),1.);tp=mix((uPart[0]*q).xyz,(uPartL[0]*q).xyz,lag);hot=1.;}
  else if(pi==6){int ki=int(floor(position.x)+.5);float u=fract(position.x);           // tentacles: 12 of them, from all over the body
    vec4 B=uTB[ki],D=uTD[ki];vec3 base=(uPart[0]*vec4(B.xyz,1.)).xyz;vec3 d0=normalize(mat3(uPart[0])*D.xyz);float len=B.w;
    vec3 a1=normalize(cross(d0,vec3(.0013,1.,.0021)));vec3 a2=cross(d0,a1);float tw=uT*(.65+.2*sin(D.w*3.))+u*3.3+D.w;
    vec3 c=base+d0*u*len+(a1*sin(tw)+a2*sin(tw*1.27+1.))*.24*u*len;
    c.y-=u*u*len*.14*(1.-uReach);c.z+=uReach*u*u*len*.55;
    float rad=mix(len*.085,1.1,pow(u,.8))*(.2+.8*position.z);c+=(a1*cos(position.y)+a2*sin(position.y))*rad;tp=c;}
  else{vec4 q=vec4(position,1.);tp=mix((uPart[pi]*q).xyz,(uPartL[pi]*q).xyz,lag);if(pi==11)hot=uMaw;}
  vec3 w=tp*.045;tp+=vec3(sin(w.y*1.7+uT*1.1)+sin(w.z*2.3-uT*.8),sin(w.z*1.9+uT*.9)+sin(w.x*2.1+uT*1.3),sin(w.x*1.5-uT*1.2)+sin(w.y*2.5+uT*.7))*(1.5+uAg*1.3);
  if(aSeed.w>.983&&pi!=8){float dk=fract(uT*.11+aSeed.y*7.);tp+=vec3((aSeed.x-.5)*12.*dk,-dk*dk*75.,(aSeed.z-.5)*12.*dk);}  // drips that fall and crawl back
  float ph=aSeed.y*6.2832,ca2=1.6+2.4*fract(aSeed.y*7.31);tp+=vec3(sin(uT*.55+ph),sin(uT*.43+ph*1.7),cos(uT*.5+ph*2.3))*(pi==8?.4:ca2)+vec3(sin(uT*2.1+aSeed.w*40.),cos(uT*1.9+aSeed.x*40.),sin(uT*2.3+aSeed.z*40.))*.35;
  float ca=aSeed.w*6.2832+uT*.04*(.5+aSeed.x);float cr=40.+aSeed.z*aSeed.z*620.;
  vec3 cp=uCloud+vec3(cos(ca)*cr,1.+aSeed.y*aSeed.y*70.,sin(ca)*cr*.55);
  float k=clamp(uRes*1.7-aSeed.x*.7,0.,1.);k=k*k*(3.-2.*k);
  vec3 p=mix(cp,tp,k);float sw=sin(k*3.1416);p.y+=sw*50.*aSeed.z;p.xz+=sw*vec2(cos(ca*3.),sin(ca*3.))*70.*aSeed.y;
  float q=uQ*(1.-k*.6);float st=floor(uT*9.+aSeed.x*3.);
  p+=(vec3(hs(st+aSeed.y*91.7),hs(st*1.3+aSeed.z*57.1),hs(st*.7+aSeed.w*33.3))-.5)*q*(3.+aSeed.x*14.);
  vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
  float un=1.-k;float px=uSize*(1.+hot*.7+un*1.6)*uScale/max(.001,-mv.z);float cl=clamp(px,uMin+un*.8,uMax);
  vA=uGain*mix(1.,uCG,un)*(1.+hot*2.2*(.5+.5*uPulse)*k)*min(1.,px*px/(cl*cl)+.35);gl_PointSize=cl;vC=vec3(1.,0.,0.);}`,
 fragmentShader:DOT_FRAG},ADD));

// The unmeasurable: dots made of dots, rotating through four dimensions (mote close-up and the intel brief)
const fracMat=new T.ShaderMaterial(Object.assign({uniforms:{uR0:{value:new T.Matrix4()},uR1:{value:new T.Matrix4()},uR2:{value:new T.Matrix4()},uR3:{value:new T.Matrix4()},uR4:{value:new T.Matrix4()},
  uUnf:{value:0},uSz:{value:1},uW:{value:2.4},uSize:{value:.03},uScale:{value:1},uMin:{value:1.2},uMax:{value:20},uSoft:{value:0},uGain:{value:1},uK:{value:.42}},
 vertexShader:`uniform mat4 uR0,uR1,uR2,uR3,uR4;uniform float uUnf,uSz,uW,uSize,uScale,uMin,uMax,uGain,uK;varying vec3 vC;varying float vA;
 vec4 tv(float d){return vec4(mod(d,2.),mod(floor(d*.5),2.),mod(floor(d*.25),2.),floor(d*.125))*2.-1.;}
 float sm(float l){float k=clamp(uUnf-l,0.,1.);return k*k*(3.-2.*k);}
 void main(){float a=position.x,b=position.y;
  vec4 p=uR0*tv(mod(a,16.))*sm(0.)+uR1*tv(floor(a/16.))*uK*sm(1.)+uR2*tv(mod(b,16.))*uK*uK*sm(2.)
   +uR3*tv(floor(b/16.))*uK*uK*uK*sm(3.)+uR4*tv(position.z)*uK*uK*uK*uK*sm(4.);
  float w=uW/(uW+1.6-p.w);vec3 q=p.xyz*w*uSz;
  vec4 mv=modelViewMatrix*vec4(q,1.);gl_Position=projectionMatrix*mv;
  float px=uSize*uScale/max(.001,-mv.z);float cl=clamp(px,uMin,uMax);
  float depth=clamp(.6+p.w*.25,.2,1.4);
  vA=uGain*depth*min(1.,px*px/(cl*cl)+.35);gl_PointSize=cl;vC=vec3(1.,0.,0.);}`,
 fragmentShader:DOT_FRAG},ADD));

// ---------------------------------------------------------------- post: bloom + sensor / thermal look + interference
const FS_V=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
const downMat=new T.ShaderMaterial({uniforms:{tA:{value:null},uPx:{value:new T.Vector2()}},vertexShader:FS_V,depthTest:false,depthWrite:false,
 fragmentShader:`uniform sampler2D tA;uniform vec2 uPx;varying vec2 vUv;void main(){vec2 o=uPx*.5;
 gl_FragColor=(texture2D(tA,vUv+vec2(-o.x,-o.y))+texture2D(tA,vUv+vec2(o.x,-o.y))+texture2D(tA,vUv+vec2(-o.x,o.y))+texture2D(tA,vUv+vec2(o.x,o.y)))*.25;}`});
const blurMat=new T.ShaderMaterial({uniforms:{tA:{value:null},uD:{value:new T.Vector2()}},vertexShader:FS_V,depthTest:false,depthWrite:false,
 fragmentShader:`uniform sampler2D tA;uniform vec2 uD;varying vec2 vUv;void main(){
 vec4 c=texture2D(tA,vUv)*.2270;c+=(texture2D(tA,vUv+uD*1.3846)+texture2D(tA,vUv-uD*1.3846))*.3162;
 c+=(texture2D(tA,vUv+uD*3.2308)+texture2D(tA,vUv-uD*3.2308))*.0703;gl_FragColor=c;}`});
const finMat=new T.ShaderMaterial({uniforms:{tS:{value:null},tH:{value:null},tQ:{value:null},uMode:{value:0},uI:{value:0},uT:{value:0},uPix:{value:1},
  uRes:{value:new T.Vector2()},uExp:{value:1},uFlash:{value:0}},vertexShader:FS_V,depthTest:false,depthWrite:false,
 fragmentShader:`uniform sampler2D tS,tH,tQ;uniform float uMode,uI,uT,uPix,uExp,uFlash;uniform vec2 uRes;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 vec3 iron(float t){t=clamp(t,0.,1.);
  vec3 a=vec3(.02,.02,.07),b=vec3(.22,.04,.42),c=vec3(.72,.08,.38),d=vec3(.97,.42,.06),e=vec3(1.,.83,.25),f=vec3(1.,1.,.92);
  return t<.2?mix(a,b,t/.2):t<.42?mix(b,c,(t-.2)/.22):t<.62?mix(c,d,(t-.42)/.2):t<.82?mix(d,e,(t-.62)/.2):mix(e,f,(t-.82)/.18);}
 vec3 look(vec2 uv){vec4 s=texture2D(tS,uv),bh=texture2D(tH,uv),bq=texture2D(tQ,uv);vec3 col;
  if(uMode<.5){float I=s.r+bh.r*.9+bq.r*.8;float A=s.b+bh.b*.9+bq.b*.6;float G=s.g+bh.g*.35;
   col=vec3(.011,.015,.019);
   col+=vec3(1.,.08,.035)*(1.-exp(-I*1.4))*1.05+vec3(1.,.48,.14)*smoothstep(1.2,5.,I)*.85+vec3(1.,.95,.85)*smoothstep(5.,18.,I)*.8;
   col+=vec3(.2,1.,.45)*(1.-exp(-A*1.5))+vec3(.9,1.,.9)*smoothstep(3.,9.,A)*.5;
   col+=vec3(.12,.5,.44)*G;}
  else{float Tm=(s.r*.25+bh.r*.9+bq.r*1.6+(s.b*.15+bh.b*.5+bq.b*.9)*.6)*uExp;
   float bg=.05+.035*h(floor(uv*uRes/6.)+floor(uT*3.))+.04*uv.y;
   col=iron(bg+ (1.-exp(-Tm))*.95)+vec3(.05,.08,.08)*s.g;}
  return col;}
 void main(){vec2 uv=vUv;float I=uI;
  if(uPix>1.01){vec2 g=uRes/uPix;uv=(floor(uv*g)+.5)/g;}
  float fr=floor(uT*18.);
  float band=floor(uv.y*46.+fr*13.);
  float on=step(1.-I*.55,h(vec2(band*.37,fr)));uv.x+=(h(vec2(band,fr*1.7))-.5)*.09*I*on;
  vec2 blk=floor(uv*vec2(10.,16.));float bg=step(1.-I*I*.3,h(blk+fr*.31));
  uv+=bg*(vec2(h(blk+1.3+fr),h(blk+2.7+fr))-.5)*.07;
  float ca=.0012+.011*I;
  vec3 col=vec3(look(uv+vec2(ca,0.)).r,look(uv).g,look(uv-vec2(ca,0.)).b);
  // interference: fog, snow, dropouts
  float snow=h(uv*uRes*.5+fract(uT*61.)*vec2(91.,17.));
  col=mix(col,vec3(.16,.2,.2)*(.6+.8*snow),I*.42);
  col+=vec3(snow*snow)*.16*I;
  float drop=step(.985-I*.06,h(vec2(floor(uv.y*120.),fr)));col=mix(col,vec3(.5,.62,.6)*snow,drop*I*.8);
  col*=.93+.07*sin(uv.y*uRes.y*1.6);
  vec2 q=vUv-.5;col*=1.-dot(q,q)*.9;
  col+=vec3(1.,.4,.3)*uFlash;
  col+=(h(vUv*uRes+uT)-.5)*.025;
  gl_FragColor=vec4(col,1.);}`});
function pass(mat,target){fsQuad.material=mat;R.setRenderTarget(target);R.render(fsScene,fsCam);}

// ---------------------------------------------------------------- ground grid, sweep and scale marker (green channel)
const world=new T.Group();scene.add(world);
const gridG=new T.Group();world.add(gridG);
(function(){const p=[],c=[];const ring=(r,a)=>{for(let i=0;i<96;i++){const a0=i/96*Math.PI*2,a1=(i+1)/96*Math.PI*2;
  p.push(Math.cos(a0)*r,0,Math.sin(a0)*r,Math.cos(a1)*r,0,Math.sin(a1)*r);c.push(0,a,0,0,a,0);}};
 for(let i=1;i<=10;i++)ring(i/10,(i%5===0?.55:.28)*(1-i/12));
 for(let i=0;i<16;i++){const a=i/16*Math.PI*2;p.push(Math.cos(a)*.1,0,Math.sin(a)*.1,Math.cos(a),0,Math.sin(a));c.push(0,.26,0,0,.02,0);}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.setAttribute('color',new T.Float32BufferAttribute(c,3));
 gridG.add(new T.LineSegments(g,new T.LineBasicMaterial(Object.assign({vertexColors:true},ADD))));

  $('cnt').textContent=count.toLocaleString('en-US');
  const conf=clamp(1-interf*.95-(tier.id==='host'?(1-res)*.4:0),0,1);$('conf').style.width=(conf*100).toFixed(0)+'%';$('confb').classList.toggle('bad',conf<.45);
  // scale label follows its marker
  if(scaleM.visible){const p=scaleM.position.clone().setY(6.6).project(cam);const sl=$('scale');
    if(p.z<1&&Math.abs(p.x)<1.05&&Math.abs(p.y)<1.05){sl.style.display='block';sl.style.left=((p.x+1)/2*W)+'px';sl.style.top=((1-p.y)/2*H)+'px';}else sl.style.display='none';}
  else $('scale').style.display='none';
  // the sensor struggles: hold frames (a real dropped frame, not a filter)
  stut=Math.max(stut,ss(.55,1,interf)*.6);
  if(now<holdUntil)return;
  if(stut>0&&Math.random()<stut*.22)holdUntil=now+30+Math.random()*Math.random()*260*stut;
  flash*=Math.exp(-dt*7);
  // render: dots → bloom → look
  R.setRenderTarget(rtS);R.setClearColor(0x000000,1);R.clear();R.render(scene,cam);
  downMat.uniforms.tA.value=rtS.texture;downMat.uniforms.uPx.value.set(1/rtS.width,1/rtS.height);pass(downMat,rtH1);
  const spread=thermal?2.2:1;
  blurMat.uniforms.tA.value=rtH1.texture;blurMat.uniforms.uD.value.set(spread/rtH1.width,0);pass(blurMat,rtH2);
  blurMat.uniforms.tA.value=rtH2.texture;blurMat.uniforms.uD.value.set(0,spread/rtH1.height);pass(blurMat,rtH1);
  downMat.uniforms.tA.value=rtH1.texture;downMat.uniforms.uPx.value.set(1/rtH1.width,1/rtH1.height);pass(downMat,rtQ1);
  blurMat.uniforms.tA.value=rtQ1.texture;blurMat.uniforms.uD.value.set(spread*1.6/rtQ1.width,0);pass(blurMat,rtQ2);
  blurMat.uniforms.tA.value=rtQ2.texture;blurMat.uniforms.uD.value.set(0,spread*1.6/rtQ1.height);pass(blurMat,rtQ1);
  const u=finMat.uniforms;u.tS.value=rtS.texture;u.tH.value=rtH1.texture;u.tQ.value=rtQ1.texture;u.uMode.value=thermal?1:0;u.uI.value=interf;u.uT.value=simT;
  u.uPix.value=1+Math.floor(ss(.45,1,interf)*7)*PR;u.uRes.value.set(rtS.width,rtS.height);u.uFlash.value=flash;
  u.uExp.value=tier.id==='host'?.75:tier.id==='brief'?1.2:tier.id==='mote'?1.6:1.3;
  pass(finMat,null);
}
addEventListener('resize',resize);resize();
setTier(1);
// a deep link like #host or #brief opens that specimen directly; #thermal and #aggro too
(function(){const h=location.hash.slice(1).split(/[,&]/);const i=TIERS.findIndex(t=>h.includes(t.id));if(i>=0)setTier(i);if(h.includes('thermal'))setThermal(true);if(h.includes('aggro'))setAggro(true);})();
$('load').remove();
requestAnimationFrame(loop);
