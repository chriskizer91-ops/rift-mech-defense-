<script>
'use strict';
const T=THREE,V=(x,y,z)=>new T.Vector3(x,y,z),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const $=id=>document.getElementById(id);
const D=window.WAVES_DATA,RULES=D.rules;
// ---------------------------------------------------------------- the numbers (session C's weapons, session D's rules)
const GUN={rate:6,dots:11,heatShot:2.3,cool:30,delay:.45,resume:38,gapK:22};      // AC-4 tier I: game/mech/weapons.js
const LANCE={charge:1.2,dots:120,fall:[1,.8,.6],cool:.35,radius:2.2};               // LN-1
const ARC={rate:4,dots:14,jumps:4,hop:12,range:35,burn:5};                          // AR-1
const ANVIL={flight:RULES.shellFlightS,dots:800,radius:10,burn:12};                // session D: 20 s flight, -800 dots a barrage
const MECH={shield:60,hull:100,regenDelay:3,regen:20};
let diffName='medium',DIFF=D.difficulty.medium;
// ---------------------------------------------------------------- scene
const cv=document.createElement('canvas');document.body.prepend(cv);
const R=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const view=new RMD.SensorView(R);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,3000);
const swarm=new RMD.Creatures.Swarm(scene,{max:70000,maxDebris:14000});swarm.coreK=RULES.coreDamageK;
const grid=RMD.SensorView.grid(80);scene.add(grid);
const ADD=RMD.SensorView.ADD;
function lineObj(p,c){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.setAttribute('color',new T.Float32BufferAttribute(c,3));
  return new T.LineSegments(g,new T.LineBasicMaterial(Object.assign({vertexColors:true},ADD)));}
(function(){const p=[0,0,2.6,1.7,0,-1.6,1.7,0,-1.6,0,0,-.6,0,0,-.6,-1.7,0,-1.6,-1.7,0,-1.6,0,0,2.6],c=[];for(let i=0;i<p.length/3;i++)c.push(0,1.6,0);
  for(let i=0;i<48;i++){const a0=i/48*6.283,a1=(i+1)/48*6.283;p.push(Math.cos(a0)*4,0,Math.sin(a0)*4,Math.cos(a1)*4,0,Math.sin(a1)*4);c.push(0,.5,0,0,.5,0);}
  for(let i=0;i<96;i++){const a0=i/96*6.283,a1=(i+1)/96*6.283,r=ARC.range;p.push(Math.cos(a0)*r,0,Math.sin(a0)*r,Math.cos(a1)*r,0,Math.sin(a1)*r);c.push(0,(i%4<2)?.22:0,0,0,(i%4<2)?.22:0,0);}
  const l=lineObj(p,c);l.position.y=.05;l.rotation.y=Math.PI;scene.add(l);})();
const mech={pos:V(0,0,0),kind:'mech',shield:MECH.shield,hull:MECH.hull,lastHit:-9};
// squad: four green dots
const SQ=4;const sqGeo=new T.BufferGeometry();const sqPos=new Float32Array(SQ*3),sqCol=new Float32Array(SQ*3),sqI=new Float32Array(SQ),sqS=new Float32Array(SQ).fill(.45),sqB=new Float32Array(SQ);
for(const [k,a,n] of [['position',sqPos,3],['aCol',sqCol,3],['aI',sqI,1],['aS',sqS,1],['aB',sqB,1]])sqGeo.setAttribute(k,new T.BufferAttribute(a,n));
const sqMat=RMD.Creatures.dotMaterial();const sqPts=new T.Points(sqGeo,sqMat);sqPts.frustumCulled=false;scene.add(sqPts);
let squad=[];
function resetSquad(){squad=[];for(let i=0;i<SQ;i++)squad.push({pos:V(7+i*1.3,0,5+(i%2)*1.2),home:V(7+i*1.3,0,5+(i%2)*1.2),kind:'ally',gone:false,turning:0,by:null,ph:Math.random()*6});}
// lines: tracers, arcs, shells, rifts, wrecks
const MAXL=400;const lPos=new Float32Array(MAXL*6),lCol=new Float32Array(MAXL*6);const lGeo=new T.BufferGeometry();
lGeo.setAttribute('position',new T.BufferAttribute(lPos,3).setUsage(T.DynamicDrawUsage));lGeo.setAttribute('color',new T.BufferAttribute(lCol,3).setUsage(T.DynamicDrawUsage));
const lines=new T.LineSegments(lGeo,new T.LineBasicMaterial(Object.assign({vertexColors:true},ADD)));lines.frustumCulled=false;scene.add(lines);
let fx=[];function seg(a,b,life,col){fx.push({a:a.clone(),b:b.clone(),life,max:life,col:col||[.6,1.6,.5]});}
function jag(a,b,life){const n=7;let p=a.clone();for(let i=1;i<=n;i++){const q=a.clone().lerp(b,i/n);if(i<n)q.add(V((Math.random()-.5)*1.6,(Math.random()-.5)*1.6,(Math.random()-.5)*1.6));seg(p,q,life,[.9,1.9,1.2]);p=q;}}
function ring(p,r,col,n,life){n=n||32;for(let i=0;i<n;i++){const a0=i/n*6.283,a1=(i+1)/n*6.283;seg(V(p.x+Math.cos(a0)*r,.12,p.z+Math.sin(a0)*r),V(p.x+Math.cos(a1)*r,.12,p.z+Math.sin(a1)*r),life||.02,col);}}
// ---------------------------------------------------------------- waves from session D
const WAVES=[];D.missions.forEach(m=>{if(!m.waves)return;m.waves.forEach((w,i)=>WAVES.push({m,w,i,key:'M'+m.id+'W'+(i+1)}));});
let cur=0,W=null,waveT=0,cleared=false,spawnQ=[],spawnT=0,rift=null,wrecks=[],boss=null,splitDone=false,stats=null,barrages=0,shells=[];
function riftWave(w){return !!(w.stream||w.growWhileRiftOpen);}
function startWave(i){for(const c of swarm.list)c.dead=true;cur=(i+WAVES.length)%WAVES.length;const E=WAVES[cur];W=E.w;resetSquad();cleared=false;waveT=0;splitDone=false;boss=null;
  mech.shield=MECH.shield;mech.hull=MECH.hull;shells=[];$('report').style.display='none';
  barrages=RULES.barragesPerMission+RULES.barragesPerLivingSquad;
  stats={key:E.key,name:E.m.name,diff:diffName,t:0,shieldLost:0,hullLost:0,lost:0,fired:0,landed:0,wasted:0,cores:0,stripped:0,rejoin0:swarm.rejoined,bUsed:0,bTot:barrages,verdict:''};
  // what to spawn: groups of up to four, a few seconds apart, from the north; bosses straight away
  spawnQ=[];const sp=W.spawn||{};let k=0;
  for(const [id,n] of Object.entries(sp)){const key=id.toLowerCase();for(let j=0;j<n;j++){const big=RMD.Creatures.RIG[key].size>8;spawnQ.push({id:key,t:big?0:Math.floor(k/4)*3.5,big});if(!big)k++;}}
  spawnT=0;rift=riftWave(W)?{p:V(-14,0,-52),hits:0,need:DIFF.barragesPerRift,open:true,acc:0,alt:0}:null;
  wrecks=W.absorb?Array.from({length:W.absorb.wrecks||5},(_,j)=>({p:V(-30+j*15,0,-14-((j%2)*10)),gone:false})):[];
  $('wv').textContent=E.key.replace('W',' · W');$('ws').textContent=E.m.name+(W.boss?' · '+W.boss:'');$('wn').textContent=W.notes||'';
  say('<b>OVERWATCH</b> '+(W.boss?W.boss+' inbound.':'Contacts from the north.'),3);}
function spawnOne(q){const rig=RMD.Creatures.RIG[q.id];const a=Math.PI+(Math.random()-.5)*Math.PI*.55;const r=(q.big?58:36)+Math.random()*10;
  const at=q.from?q.from.clone():V(Math.sin(a)*r,0,Math.cos(a)*r);const c=swarm.spawn(q.id,at,Math.atan2(-at.x,-at.z),{n:Math.max(4,Math.round(rig.n*DIFF.enemyDots))});
  if(q.big&&!boss)boss=c;return c;}
let capT=0;function say(s,t){$('cap').innerHTML=s;capT=t||3;}
// ---------------------------------------------------------------- input
let weapon='cannon',thermal=false,zoom=1;
const ptr=new Map();let pinch0=0,zoom0=1,aim=null,holding=false;
const ndc=new T.Vector2(),ray=new T.Raycaster();
function rayFrom(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,cam);return ray.ray;}
function ground(r){const t=-r.origin.y/r.direction.y;return t>0?r.origin.clone().addScaledVector(r.direction,t):null;}
const muzzle=V(0,4,0);
const gun={heat:0,over:false,cd:0,cool:0};const lance={ch:0,cd:0,on:false};const arcS={cd:0};
let inWindow=true,windows=false;
function wasted(p){seg(muzzle,p,.08,[.35,.35,.35]);stats.wasted++;}
function cannonShot(){const r=rayFrom(aim.x,aim.y);stats.fired++;const h=swarm.pick(r.origin,r.direction);
  if(!h){const g=ground(r);if(g)seg(muzzle,g,.08,[.3,.7,.3]);return;}
  if(windows&&!inWindow){wasted(h.point);return;}
  const c=h.creature;const chance=c.count/(c.count+GUN.gapK);           // a cluster is mostly gaps: rounds pass through small ones
  if(Math.random()>chance){seg(muzzle,h.point.clone().addScaledVector(r.direction,8),.08,[.4,.9,.4]);return;}
  const k=swarm.hit(c,h.point,1.3,GUN.dots);stats.landed++;stats.stripped+=k;if(swarm.lastCore){stats.cores++;coreSeen();}seg(muzzle,h.point,.12);}
function lanceShot(ch){const r=rayFrom(aim.x,aim.y);const hits=swarm.pickAll(r.origin,r.direction).slice(0,3);const end=hits.length?hits[hits.length-1].point:(ground(r)||r.origin.clone().addScaledVector(r.direction,80));
  stats.fired++;if(windows&&!inWindow){wasted(end);return;}
  seg(muzzle,end,.3,[1.4,1.8,2.4]);seg(muzzle.clone().add(V(.2,0,0)),end,.3,[1.4,1.8,2.4]);
  hits.forEach((h,j)=>{const k=swarm.hit(h.creature,h.point,LANCE.radius,LANCE.dots*ch*LANCE.fall[j]);stats.stripped+=k;stats.landed++;if(swarm.lastCore){stats.cores++;coreSeen();}});}
function arcZap(){const r=rayFrom(aim.x,aim.y);let h=swarm.pick(r.origin,r.direction);let c=h&&h.creature;
  if(!c){const g=ground(r);if(!g)return;let bd=10;for(const o of swarm.list){if(o.dead)continue;const d=Math.hypot(o.pos.x-g.x,o.pos.z-g.z)-swarm.radius(o);if(d<bd){bd=d;c=o;}}}
  if(!c||Math.hypot(c.pos.x,c.pos.z)-swarm.radius(c)>ARC.range){const g=ground(r);if(g)seg(muzzle,muzzle.clone().lerp(g,.25),.06,[.3,.6,.5]);return;}
  stats.fired++;if(windows&&!inWindow){wasted(swarm.center(c));return;}
  let p=swarm.center(c);let k=swarm.hit(c,p,2,ARC.dots,{burn:true});swarm.burn(p,ARC.burn);stats.stripped+=k;stats.landed++;if(swarm.lastCore){stats.cores++;coreSeen();}jag(muzzle,p,.16);
  const done=new Set([c]);for(let j=0;j<ARC.jumps;j++){let best=null,bd=ARC.hop;for(const o of swarm.list){if(o.dead||done.has(o))continue;const d=Math.hypot(o.pos.x-c.pos.x,o.pos.z-c.pos.z)-swarm.radius(o)-swarm.radius(c)*.5;if(d<bd){bd=d;best=o;}}
    if(!best)break;const q=swarm.center(best);k=swarm.hit(best,q,2,ARC.dots,{burn:true});swarm.burn(q,ARC.burn);stats.stripped+=k;jag(p,q,.16);done.add(best);c=best;p=q;}}
function callAnvil(x,y){if(barrages<=0){say('<b>ANVIL</b> Nothing left on the rails.',2);return;}const g=ground(rayFrom(x,y));if(!g)return;barrages--;stats.bUsed++;
  shells.push({p:g,t:ANVIL.flight});say('<b>ANVIL</b> Shot out. '+ANVIL.flight+' seconds.',2);}
let coreT=-99;function coreSeen(){if(simT-coreT>8){say('<b>OVERWATCH</b> There. The core. Hit that and it really hurts.',2.5);}coreT=simT;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;holding=false;lance.on=false;lance.ch=0;return;}
  aim={x:e.clientX,y:e.clientY};holding=true;if(weapon==='artillery')callAnvil(e.clientX,e.clientY);if(weapon==='lance'&&lance.cd<=0){lance.on=true;lance.ch=0;}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)zoom=clamp(zoom0*pinch0/d,.5,2.4);}else if(aim){aim.x=e.clientX;aim.y=e.clientY;}});
const up=e=>{ptr.delete(e.pointerId);pinch0=0;if(ptr.size===0){if(weapon==='lance'&&lance.on&&lance.ch>=.25){lanceShot(lance.ch);lance.cd=LANCE.cool;}lance.on=false;lance.ch=0;holding=false;}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.5,2.4);},{passive:false});
function setW(w){weapon=w;['wCannon','wLance','wArc','wArt'].forEach(id=>$(id).classList.toggle('on',id==={cannon:'wCannon',lance:'wLance',arc:'wArc',artillery:'wArt'}[w]));}
$('wCannon').onclick=()=>setW('cannon');$('wLance').onclick=()=>setW('lance');$('wArc').onclick=()=>setW('arc');$('wArt').onclick=()=>setW('artillery');
function setTh(on){thermal=on;swarm.setThermal(on);sqMat.uniforms.uSoft.value=on?1:0;sqMat.uniforms.uSizeMul.value=on?4:1;$('bSensor').classList.toggle('on',!on);$('bThermal').classList.toggle('on',on);}
$('bSensor').onclick=()=>setTh(false);$('bThermal').onclick=()=>setTh(true);
$('bNext').onclick=()=>startWave(cur+1);
// menu: difficulty, every wave, the results log
const LOG=[];
function buildMenu(){const box=$('mlist');box.innerHTML='';let last=null;
  for(let i=0;i<WAVES.length;i++){const E=WAVES[i];if(E.m!==last){last=E.m;const g=document.createElement('div');g.className='grp';g.textContent='Mission '+E.m.id+' · '+E.m.name;box.appendChild(g);
      const l=document.createElement('div');l.className='list';box.appendChild(l);}
    const b=document.createElement('button');b.textContent='W'+(E.i+1)+(E.w.boss?' '+E.w.boss:'')+(E.w.split?' (split)':'');b.onclick=()=>{$('menu').style.display='none';startWave(i);};
    box.lastChild.appendChild(b);}
  document.querySelectorAll('#menu [data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===diffName));}
$('bMenu').onclick=()=>{buildMenu();$('mlog').textContent=LOG.length?LOG.join('\n'):'none yet';$('menu').style.display='block';};
$('mClose').onclick=()=>{$('menu').style.display='none';};
document.querySelectorAll('#menu [data-d]').forEach(b=>b.onclick=()=>{diffName=b.dataset.d;DIFF=D.difficulty[diffName];$('dLab').textContent=diffName;buildMenu();});
async function copyLog(el){const t='Rift Mech Defense combat sandbox results\n'+LOG.join('\n');let ok=false;try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
  $(el).textContent=ok?'Copied. Paste it to session C (balance) or here.':'Copy blocked here; the results are listed in WAVES.';}
$('rCopy').onclick=()=>copyLog('copied');$('mCopy').onclick=()=>copyLog('copied2');
$('rRetry').onclick=()=>startWave(cur);
document.querySelectorAll('#report [data-v]').forEach(b=>b.onclick=()=>{stats.verdict=b.dataset.v;LOG[LOG.length-1]=line(stats);$('copied').textContent='Noted: '+b.dataset.v+'. Next wave in 2 s.';
  setTimeout(()=>{if($('report').style.display==='block')startWave(cur+1);},2000);});
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function line(s){const acc=s.fired?Math.round(s.landed/s.fired*100):0;
  return `${s.key} ${s.name} · ${s.diff} · ${s.won?'cleared':'WRAITH DOWN'} in ${mmss(s.t)} (target ${mmss(s.target*60)}) · shield −${Math.round(s.shieldLost)} hull −${Math.round(s.hullLost)} · squad lost ${s.lost}/4 · hits ${acc}% (${s.wasted} into static) · cores ${s.cores} · dots stripped ${s.stripped}, crawled back ${s.rejoin} · ANVIL ${s.bUsed}/${s.bTot}`+(s.verdict?' · felt: '+s.verdict:'');}
function report(won){stats.won=won;stats.t=waveT;stats.target=W.min||2;stats.rejoin=swarm.rejoined-stats.rejoin0;LOG.push(line(stats));
  const acc=stats.fired?Math.round(stats.landed/stats.fired*100):0;
  $('rT').textContent=(won?'Wave clear · ':'Wraith down · ')+stats.key;
  $('rTab').innerHTML=[['Time',mmss(stats.t)+' (target '+mmss(stats.target*60)+')'],['Shield and hull taken',Math.round(stats.shieldLost)+' · '+Math.round(stats.hullLost)],
    ['Squad lost',stats.lost+' of 4'],['Hits',acc+'%, '+stats.wasted+' into the static'],['Core hits',stats.cores],['Dots stripped · crawled back',stats.stripped+' · '+stats.rejoin],
    ['ANVIL used',stats.bUsed+' of '+stats.bTot],['Difficulty',diffName]].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  $('copied').textContent='';$('report').style.display='block';}
// ---------------------------------------------------------------- loop
function resize(){R.setSize(innerWidth,innerHeight,false);view.resize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let simT=0,last=performance.now(),flash=0,shake=0;
const auto=/auto/.test(location.hash);
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;simT+=dt;
  const port=innerWidth<innerHeight;const d=(port?74:58)*zoom;
  cam.position.set((Math.random()-.5)*shake,d*.8+(Math.random()-.5)*shake,d*.62);cam.lookAt(0,0,port?-12:-6);shake*=Math.exp(-dt*6);
  const px=view.pxScale(cam);swarm.pxScale(px);sqMat.uniforms.uScale.value=px;grid.userData.sweep.rotation.y=-simT*.9;
  const playing=!cleared&&mech.hull>0;
  if(playing){waveT+=dt;
    // spawns
    spawnT+=dt;spawnQ=spawnQ.filter(q=>{if(spawnT>=q.t){spawnOne(q);return false;}return true;});
    // rift: streams small ones, or feeds the boss, until sealed
    if(rift){if(rift.open){if(W.stream){rift.acc+=dt*(W.stream.dotsPerS||4);while(rift.acc>=10){const id=(rift.alt++%3===2)?'skein':'knot';rift.acc-=id==='skein'?20:10;spawnOne({id,from:rift.p.clone().add(V((Math.random()-.5)*6,0,0)),big:false});}}
        if(W.growWhileRiftOpen&&boss&&!boss.dead&&boss.count<W.growWhileRiftOpen.max*DIFF.enemyDots){rift.acc+=dt*W.growWhileRiftOpen.dotsPerS;const n=Math.floor(rift.acc);if(n>0){swarm.grow(boss,n);rift.acc-=n;}}}
      else if(W.shedWhenSealed&&boss&&!boss.dead){rift.acc+=dt*W.shedWhenSealed.dotsPerS;const n=Math.floor(rift.acc);if(n>0){swarm.shed(boss,n);rift.acc-=n;}}}
    // the TITAN splits at 35,000: four 5,000-dot tendrils go for the squad
    if(boss&&boss.rig.id==='titan'&&!splitDone&&boss.count<35000*DIFF.enemyDots){splitDone=true;const n=Math.round(5000*DIFF.enemyDots);
      let k=0;for(const q of boss.P){if(k>=n*4)break;if(q.alive&&Math.random()<.5){q.alive=false;k++;}}boss.count-=k;
      for(let j=0;j<4;j++){const a=j/4*6.283;swarm.spawn('hulk',boss.pos.clone().add(V(Math.cos(a)*18,0,Math.sin(a)*18)),0,{n});}
      say('<b>OVERWATCH</b> It split. Four of them, five thousand each, going for the squad.',3.5);}
  }
  // the sensor near big ones: interference, and clear windows only
  let I=.03;for(const c of swarm.list){if(c.dead)continue;const dd=Math.hypot(c.pos.x,c.pos.z);I=Math.max(I,ss(16+c.rig.size*1.6,3+c.rig.size*.3,dd)*clamp(.2+c.count/4000,.2,.8));}
  windows=I>.42;const win=RULES.window.baseS*DIFF.windowK,ph=simT%RULES.window.periodS;inWindow=!windows||ph<win;
  const Ishow=clamp((windows&&inWindow?I*.3:I)+flash*.5,0,1);flash*=Math.exp(-dt*5);
  $('lock').className=windows?(inWindow?'on':'off'):'';$('lock').textContent=windows?(inWindow?'◆ LOCK':'STATIC · WAIT'):'';
  if(windows&&!stats.toldWait){stats.toldWait=true;say('<b>OVERWATCH</b> Don’t fire into the static. Wait for me to lock. Then fire.',3.5);}
  // weapons
  gun.cd-=dt;arcS.cd-=dt;lance.cd-=dt;
  const firing=playing&&aim&&(holding||auto);
  if(auto&&swarm.list.length){let best=null,bd=1e9;for(const c of swarm.list){if(c.dead)continue;const dd=c.pos.length();if(dd<bd){bd=dd;best=c;}}if(best){const q=swarm.center(best).project(cam);aim={x:(q.x+1)/2*innerWidth,y:(1-q.y)/2*innerHeight};}}
  if(firing&&weapon==='cannon'&&!gun.over){while(gun.cd<=0){cannonShot();gun.cd+=1/GUN.rate;gun.heat+=GUN.heatShot;gun.cool=GUN.delay;if(gun.heat>=100){gun.heat=100;gun.over=true;say('<b>OVERWATCH</b> Gun’s cooking. Let it breathe.',1.8);break;}}}
  else{if(gun.cd<0)gun.cd=0;gun.cool-=dt;if(gun.cool<=0)gun.heat=Math.max(0,gun.heat-GUN.cool*(gun.over?.8:1)*dt);if(gun.over&&gun.heat<=GUN.resume)gun.over=false;}
  if(firing&&weapon==='arc'&&arcS.cd<=0){arcZap();arcS.cd=1/ARC.rate;}
  if(lance.on){lance.ch=Math.min(1,lance.ch+dt/LANCE.charge);if(lance.ch>=1&&weapon==='lance'){lanceShot(1);lance.cd=LANCE.cool;lance.on=false;lance.ch=0;}}
  if(auto&&weapon==='lance'&&lance.cd<=0&&!lance.on){lance.on=true;}
  $('heatM').style.width=gun.heat+'%';$('heatM').classList.toggle('hot',gun.over);$('lanceM').style.width=(lance.ch*100)+'%';$('wArt').querySelector('small').textContent=barrages+' left · tap ground';
  // shells
  for(const s of shells){s.t-=dt;ring(s.p,ANVIL.radius*(.35+.65*Math.min(1,s.t/ANVIL.flight)),[1.2,.45,.1],28);
    if(s.t<=0){const k=swarm.blast(s.p,ANVIL.radius,(W.barrageDots||ANVIL.dots));swarm.burn(s.p,ANVIL.burn);stats.stripped+=k;flash=.5;shake=3;
      for(let i=0;i<30;i++){const a=Math.random()*6.283;seg(s.p,V(s.p.x+Math.cos(a)*10,Math.random()*6,s.p.z+Math.sin(a)*10),.35,[1.6,.6,.2]);}
      if(rift&&rift.open&&Math.hypot(s.p.x-rift.p.x,s.p.z-rift.p.z)<ANVIL.radius+4){rift.hits++;if(rift.hits>=rift.need){rift.open=false;say('<b>ANVIL</b> Rift’s down. It’s closed.',3);}
        else say('<b>ANVIL</b> On target. '+(rift.need-rift.hits)+' more to close it.',2.5);}}}
  shells=shells.filter(s=>s.t>0);
  if(rift){const pulse=.6+.4*Math.sin(simT*3);const col=rift.open?[1.4*pulse,.5*pulse,.05]:[.25,.25,.25];
    for(let i=0;i<6;i++){const x0=rift.p.x-7+i*2.3,x1=x0+2.3;seg(V(x0,.1,rift.p.z+Math.sin(i*1.7)*.8),V(x1,.1,rift.p.z+Math.sin((i+1)*1.7)*.8),.02,col);}
    if(rift.open)ring(rift.p,9,[.5,.2,.03],24);}
  for(const w of wrecks){if(w.gone)continue;const p=w.p;for(const [a,b] of [[[-1.5,-1],[1.5,-1]],[[1.5,-1],[1.5,1]],[[1.5,1],[-1.5,1]],[[-1.5,1],[-1.5,-1]]])seg(V(p.x+a[0],.1,p.z+a[1]),V(p.x+b[0],.1,p.z+b[1]),.02,[0,.5,0]);
    for(const c of swarm.list){if(c.dead||c.n0<300)continue;if(Math.hypot(c.pos.x-p.x,c.pos.z-p.z)<swarm.radius(c)+2){w.gone=true;swarm.absorb(c,p,W.absorb.dots||40);say('<b>OVERWATCH</b> It took the wreck. It’s bigger.',2.2);break;}}}
  // targets and the fight at close range
  const targets=[mech,...squad.filter(a=>!a.gone&&!a.turning)];
  swarm.update(dt,simT,targets);
  for(const c of swarm.list){if(!c.mauling||!c.target||!playing)continue;const tg=c.target;
    if(tg.kind==='mech'&&c.state==='maul'){let dmg=dt*DIFF.enemyDamage*(2+Math.sqrt(c.count)*.35);mech.lastHit=simT;shake=Math.max(shake,.4);
      const s=Math.min(mech.shield,dmg);mech.shield-=s;stats.shieldLost+=s;dmg-=s;mech.hull-=dmg;stats.hullLost+=dmg;}
    else if(tg.kind==='ally'&&!tg.turning){tg.turning=simT;tg.by=c;}}
  if(simT-mech.lastHit>MECH.regenDelay)mech.shield=Math.min(MECH.shield,mech.shield+MECH.regen*dt);
  let alive=0;squad.forEach((a,i)=>{const ph=simT*.8+a.ph;
    if(a.turning){const f=(simT-a.turning)/1.2;if(f>=1&&!a.gone){a.gone=true;stats.lost++;swarm.absorb(a.by,a.pos,Math.round(RULES.lostSquadDots/SQ));say('<b>OVERWATCH</b> We lost one… their marker just turned red.',3);}}
    else a.pos.set(a.home.x+Math.sin(ph)*.25,0,a.home.z+Math.cos(ph*.7)*.25);
    if(!a.gone)alive++;const fl=a.turning?(Math.sin((simT-a.turning)*(8+(simT-a.turning)*30))>0):false;
    sqPos.set([a.pos.x,.9,a.pos.z],i*3);sqCol.set(a.gone?[0,0,0]:fl?[1,0,0]:[0,0,1],i*3);sqI[i]=a.gone?0:(thermal?.25:1.3);});
  sqGeo.attributes.position.needsUpdate=sqGeo.attributes.aCol.needsUpdate=sqGeo.attributes.aI.needsUpdate=true;
  let n=0;for(const f of fx){f.life-=dt;if(f.life<=0||n>=MAXL)continue;const k=f.life/f.max;lPos.set([f.a.x,f.a.y,f.a.z,f.b.x,f.b.y,f.b.z],n*6);const c=f.col.map(v=>v*Math.min(1,k*1.5));lCol.set([...c,...c],n*6);n++;}
  fx=fx.filter(f=>f.life>0);lGeo.setDrawRange(0,n*2);lGeo.attributes.position.needsUpdate=lGeo.attributes.color.needsUpdate=true;
  // end of wave
  if(playing&&waveT>2&&spawnQ.length===0&&swarm.list.length===0&&!(rift&&rift.open&&W.stream)){cleared=true;report(true);}
  if(!cleared&&mech.hull<=0){mech.hull=0;cleared=true;report(false);}
  // HUD
  $('cnt').textContent=swarm.dots.toLocaleString('en-US');$('sq').textContent=alive+' / '+SQ;$('bar').textContent=barrages;
  $('shield').style.width=(mech.shield/MECH.shield*100)+'%';$('hull').style.width=clamp(mech.hull,0,100)+'%';$('hb').classList.toggle('bad',mech.hull<35);
  $('tm').textContent=mmss(waveT)+' / target '+mmss((W.min||2)*60)+(rift?(rift.open?' · rift open ('+rift.hits+'/'+rift.need+')':' · rift sealed'):'');
  capT-=dt;if(capT<0)$('cap').innerHTML='';
  if(view.skip(now,ss(.55,1,Ishow)*.6))return;
  view.render(scene,cam,{thermal,interf:Ishow,flash:flash*.5,exposure:1.3});
}
startWave(0);
(function(){const h=location.hash;const m=h.match(/M(\d)W(\d)/i);if(m){const i=WAVES.findIndex(E=>E.key==='M'+m[1]+'W'+m[2]);if(i>=0)startWave(i);}
  if(/thermal/.test(h))setTh(true);const w=h.match(/(cannon|lance|arc)/);if(w)setW(w[1]);if(/easy|hard/.test(h)){diffName=h.match(/easy|hard/)[0];DIFF=D.difficulty[diffName];$('dLab').textContent=diffName;startWave(cur);}})();
requestAnimationFrame(loop);
</script></body></html>
